<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Plasma & Fire Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="60%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#e85d04" />
    </linearGradient>

    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ffe6a7" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#fb8500" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="emberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .orbit-ring {
        transform-origin: 50px 50px;
        animation: spin-slow 12s linear infinite;
      }
      .plasma-core {
        transform-origin: 50px 50px;
        animation: pulse-glow 2.5s ease-in-out infinite alternate;
      }
      .spark-particle {
        transform-origin: 50px 50px;
        animation: spark-drift 3s ease-in-out infinite;
      }
      @keyframes spin-slow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0% { transform: scale(0.92); opacity: 0.85; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes spark-drift {
        0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.6; }
        50% { transform: translateY(-3px) scale(1.1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit-ring, .plasma-core, .spark-particle {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Deep Obsidian Shield Background -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="#0d0a1a" stroke="url(#shieldGrad)" stroke-width="3" filter="url(#emberGlow)" />

  <!-- Inner Refraction Edge -->
  <polygon points="50,11 83,30 83,70 50,89 17,70 17,30" fill="#17122c" fill-opacity="0.7" stroke="#fb8500" stroke-width="1" stroke-opacity="0.4" />

  <!-- Rotating Temporal Orbit Ring -->
  <g class="orbit-ring">
    <ellipse cx="50" cy="50" rx="34" ry="18" fill="none" stroke="url(#shieldGrad)" stroke-width="1.8" stroke-dasharray="5 4 10 4" transform="rotate(-25 50 50)" />
    <circle cx="78" cy="38" r="2.8" fill="#ffb703" filter="url(#emberGlow)" />
    <circle cx="22" cy="62" r="2.2" fill="#d90429" filter="url(#emberGlow)" />
  </g>

  <!-- Chrono Hourglass Body (Molten Chamber) -->
  <g class="plasma-core">
    <!-- Top Triangle -->
    <polygon points="34,31 66,31 50,47" fill="url(#coreGrad)" fill-opacity="0.9" />
    <!-- Bottom Triangle -->
    <polygon points="50,53 66,69 34,69" fill="url(#coreGrad)" fill-opacity="0.9" />
    <!-- Hourglass Frame Structure -->
    <line x1="32" y1="29" x2="68" y2="29" stroke="#ffe6a7" stroke-width="2" stroke-linecap="round" />
    <line x1="32" y1="71" x2="68" y2="71" stroke="#ffe6a7" stroke-width="2" stroke-linecap="round" />
    <path d="M 34,31 Q 50,49 34,69" fill="none" stroke="#fb8500" stroke-width="1.5" />
    <path d="M 66,31 Q 50,49 66,69" fill="none" stroke="#fb8500" stroke-width="1.5" />
  </g>

  <!-- Central Temporal Spark & Molten Embers -->
  <circle cx="50" cy="50" r="14" fill="url(#sparkGlow)" class="plasma-core" />
  <circle cx="50" cy="50" r="3" fill="#ffffff" />
  <circle cx="50" cy="42" r="1.5" fill="#fff3b0" class="spark-particle" />
  <circle cx="50" cy="58" r="1.5" fill="#ffb703" class="spark-particle" />
</svg>
